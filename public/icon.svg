<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Receipt Paper Gradient -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Scanner Laser Beam Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="25%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Laser Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Shadow Filter -->
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="blur(40px)" />

  <!-- Receipt Paper -->
  <g filter="url(#paperShadow)">
    <path
      d="M168 116C168 107.163 175.163 100 184 100H328C336.837 100 344 107.163 344 116V380L326 366L308 380L290 366L272 380L256 366L240 380L222 366L204 380L186 366L168 380V116Z"
      fill="url(#paperGrad)"
    />

    <!-- Header bar -->
    <rect x="196" y="132" width="120" height="14" rx="7" fill="#cbd5e1" />
    <rect x="220" y="156" width="72" height="8" rx="4" fill="#e2e8f0" />

    <!-- Dashed separator -->
    <line x1="196" y1="184" x2="316" y2="184" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6" />

    <!-- Receipt item lines -->
    <rect x="196" y="208" width="80" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="292" y="208" width="24" height="9" rx="4.5" fill="#64748b" />

    <rect x="196" y="232" width="64" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="292" y="232" width="24" height="9" rx="4.5" fill="#64748b" />

    <rect x="196" y="256" width="72" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="292" y="256" width="24" height="9" rx="4.5" fill="#64748b" />

    <!-- Second separator -->
    <line x1="196" y1="284" x2="316" y2="284" stroke="#cbd5e1" stroke-width="2" />

    <!-- Total row -->
    <rect x="196" y="304" width="48" height="12" rx="6" fill="#0f172a" />
    <rect x="276" y="304" width="40" height="12" rx="6" fill="#10b981" />
  </g>

  <!-- Glowing Scanner Laser Beam -->
  <g filter="url(#laserGlow)">
    <!-- Scanning band -->
    <rect x="120" y="236" width="272" height="20" fill="url(#laserGrad)" opacity="0.3" />
    <!-- Bright core line -->
    <rect x="128" y="244" width="256" height="4" rx="2" fill="url(#laserGrad)" />
    <!-- Center pulse dot -->
    <circle cx="256" cy="246" r="4" fill="#ffffff" />
  </g>

  <!-- AI Neural / Sparkle Accent in Top Right -->
  <g transform="translate(340, 104)">
    <path
      d="M16 0C16 8.83656 23.1634 16 32 16C23.1634 16 16 23.1634 16 32C16 23.1634 8.83656 16 0 16C8.83656 16 16 8.83656 16 0Z"
      fill="#38bdf8"
    />
    <circle cx="16" cy="16" r="3" fill="#ffffff" />
  </g>
</svg>
